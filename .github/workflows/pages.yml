# main 에 push 하면 테스트를 돌리고 site/ 폴더만 GitHub Pages 에 배포한다
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # Pages 는 파일을 10분 캐시한다. 배포마다 파일 주소에 버전을 붙여, 폰에 남은 옛 파일과 새 파일이 섞이지 않게 한다
      - name: Stamp asset URLs with the commit
        run: |
          v=${GITHUB_SHA::8}
          sed -i -E "s#(from \"\./[a-z]+\.js)\"#\1?v=$v\"#g" site/*.js
          sed -i -E "s#((src|href)=\"(\.\./)?(main\.js|styles\.css|covers\.css))\"#\1?v=$v\"#g" site/index.html site/*/index.html
          grep -c "?v=$v" site/*.js site/index.html site/*/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
