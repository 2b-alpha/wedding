<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>청첩장 첫 화면 시안</title>
<!--
  PROTOTYPE (버릴 코드)
  질문: 모바일 청첩장 첫 화면 인트로를 어떤 방향으로 갈까?
  세 가지 시안을 ?variant=A|B|C 로 전환한다. ?revisit=1 은 재방문(인트로 생략) 상태.
  하단 바는 시안 비교용이며 실제 청첩장에는 넣지 않는다.
  시안 확인을 위해 기기의 '동작 줄이기' 설정은 일부러 무시한다(실제 버전에서는 따른다).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Inter+Tight:wght@200;300;500;600&family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#141416}
body{min-height:100svh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}

.phone{
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .38 0 0 0 0 .30 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  position:relative;width:min(100%,430px);margin:0 auto;min-height:100svh;overflow-x:hidden;
  background:var(--bg);color:var(--ink);font-family:var(--kr);
}
.hero{position:relative;height:100svh;min-height:540px;overflow:hidden}

/* 건너뛰기: 모든 CSS 애니메이션을 끄면 각 요소의 기본 스타일(= 최종 상태)만 남는다 */
.skip,.skip *{animation:none!important}

.fu{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) var(--d,0s) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
@keyframes fadeIn{from{opacity:0}}

.hint{position:absolute;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));width:20px;height:12px;margin-left:-10px;color:var(--muted);fill:none;stroke:currentColor;stroke-width:1.5;
  animation:fadeIn .6s ease var(--hd) both,bob 1.8s ease-in-out calc(var(--hd) + .6s) infinite}
.skip .hint{animation:bob 1.8s ease-in-out infinite!important}
@keyframes bob{50%{transform:translateY(5px)}}

/* ---------- 본문 (시안 공통, 첫 화면이 어떻게 이어지는지 보기 위한 맥락) ---------- */
.body{padding:88px 30px 150px;text-align:center}
.body h2{font:500 12px/1 var(--latin);letter-spacing:.32em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.body p{font:400 15px/1.95 var(--kr);color:var(--muted)}
.body .names{margin-top:26px;font-weight:500;color:var(--ink);letter-spacing:.08em}
.block{margin-top:72px}
.body .big{font-size:17px;line-height:1.7;color:var(--ink)}
.mapph{margin-top:22px;height:170px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.btns{display:flex;gap:8px;justify-content:center;margin-top:14px}
.btns a{font:400 13px var(--kr);padding:9px 14px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none}
.body .note{margin-top:84px;font-size:11px;opacity:.6}

/* ---------- A. 편지: 봉인된 카드의 문이 열린다 ---------- */
.vA{--bg:#f4efe6;--ink:#3b322b;--muted:#85776b;--accent:#a96f5f;--line:#d8ccb9;--card:#ebe3d5;--kr:"Noto Serif KR",serif;--latin:"Cormorant Garamond",serif;--hd:2.5s}
.vA .hero{background:radial-gradient(120% 80% at 50% 38%,#fbf8f2 0%,#f2ece1 65%,#e8dfd0 100%)}
.vA .paper{position:absolute;inset:0;background:var(--noise);opacity:.22;mix-blend-mode:multiply}
.vA .frame{position:absolute;inset:calc(20px + env(safe-area-inset-top)) 20px 20px;border:1px solid #cdbfa8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.vA .frame::before{content:"";position:absolute;inset:5px;border:1px solid #e2d8c7;pointer-events:none}
.vA .eyebrow{font:italic 400 23px/1 var(--latin);color:var(--accent)}
.vA .rings{margin:24px 0 22px}
.vA .rings svg{display:block;width:44px;fill:none;stroke:var(--accent);stroke-width:1.2}
.vA .nm{font:500 29px/1.3 var(--kr);letter-spacing:.16em;padding-left:.16em}
.vA .and{font:italic 400 21px/1.4 var(--latin);color:var(--accent);margin:4px 0}
.vA .rule{display:block;width:36px;height:1px;background:#c9b9a1;margin:30px 0 24px}
.vA .when{font:400 15px/1.85 var(--kr);letter-spacing:.04em}
.vA .where{margin-top:8px;font:400 13px/1.7 var(--kr);color:var(--muted)}
.vA .rv{animation:fadeUp .85s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(1.15s + var(--i) * .09s)}
.vA .doors{position:absolute;inset:0;perspective:1500px;pointer-events:none}
.vA .door{position:absolute;top:0;bottom:0;width:50%;background:var(--noise),linear-gradient(#efe7da,#e7dccb);visibility:hidden;opacity:0;animation:1.7s cubic-bezier(.55,0,.25,1) both}
.vA .door.l{left:0;transform-origin:0 50%;animation-name:aDoorL;box-shadow:inset -1px 0 0 #cbbca5,6px 0 18px rgba(80,60,40,.08)}
.vA .door.r{right:0;transform-origin:100% 50%;animation-name:aDoorR;box-shadow:inset 1px 0 0 #cbbca5}
.vA .door span{position:absolute;top:calc(20px + env(safe-area-inset-top));bottom:20px;border:1px solid #cdbfa8}
.vA .door.l span{left:20px;right:0;border-right:0}
.vA .door.r span{left:0;right:20px;border-left:0}
@keyframes aDoorL{0%,30%{visibility:visible;opacity:1;transform:rotateY(0)}85%{opacity:1}100%{visibility:visible;opacity:0;transform:rotateY(-98deg)}}
@keyframes aDoorR{0%,30%{visibility:visible;opacity:1;transform:rotateY(0)}85%{opacity:1}100%{visibility:visible;opacity:0;transform:rotateY(98deg)}}
.vA .seal{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#b3554c,#7d2d28 70%);box-shadow:0 3px 8px rgba(80,20,15,.3),inset 0 0 0 4px rgba(255,255,255,.07);
  opacity:0;animation:aSeal .6s cubic-bezier(.4,0,.2,1) .25s both}
.vA .seal svg{width:34px;fill:none;stroke:#f3e1cc;stroke-width:1.6}
@keyframes aSeal{0%{opacity:1;transform:scale(1)}35%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(.5)}}

/* ---------- B. 달력: 날짜가 주인공 ---------- */
.vB{--bg:#faf9f6;--ink:#1d1d1f;--muted:#76767c;--accent:#e2615c;--line:#e0ddd6;--card:#f0eee8;--kr:"Noto Sans KR",sans-serif;--latin:"Inter Tight",sans-serif;--hd:2.4s}
.vB .hero{height:auto;min-height:100svh;display:flex;flex-direction:column;padding:calc(6svh + env(safe-area-inset-top)) 26px 112px}
.vB .top{display:flex;justify-content:space-between;font:600 11px/1 var(--latin);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.vB .stack{margin-top:3svh;font:200 min(30vw,12svh,124px)/1 var(--latin);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.vB .ln{display:flex;height:.9em}
.vB .dg{display:block;height:.9em;overflow:hidden}
.vB .col{display:block;transform:translateY(calc(var(--t) * -.9em));animation:bRoll 1.3s cubic-bezier(.12,.7,.1,1) both}
.vB .col i{display:block;height:.9em;line-height:.9em;font-style:normal}
@keyframes bRoll{from{transform:translateY(.9em)}}
.vB .dow{margin:.14em 0 0 14px;font:600 12px/1.55 var(--latin);letter-spacing:.2em;color:var(--accent);font-style:normal}
.vB .cal{margin:4svh 0}
.vB .calh{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.vB .calh b{font:600 11px/1 var(--latin);letter-spacing:.24em;text-transform:uppercase}
.vB .calh span{font:400 12px/1 var(--kr);color:var(--muted)}
.vB .grid{display:grid;grid-template-columns:repeat(7,1fr);font:300 14px/28px var(--latin);text-align:center}
.vB .wk{font:400 11px/28px var(--kr);color:var(--muted);animation:fadeIn .4s ease .7s both}
.vB .sun{color:#c7817e}
.vB .d{position:relative;animation:fadeIn .35s ease both;animation-delay:calc(.75s + var(--k) * .016s)}
.vB .on{font-weight:600;color:var(--ink)}
.vB .on svg{position:absolute;left:50%;top:50%;width:42px;height:36px;transform:translate(-50%,-50%);overflow:visible;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round}
.vB .on path{stroke-dasharray:1;stroke-dashoffset:0;animation:bDraw .8s cubic-bezier(.5,0,.25,1) 1.4s both}
@keyframes bDraw{from{stroke-dashoffset:1}}
.vB .who{margin-top:auto;padding-top:18px;border-top:1px solid var(--line)}
.vB .nms{display:flex;align-items:center;gap:12px;font:500 19px/1.3 var(--kr);letter-spacing:.06em}
.vB .nms i{width:16px;height:1px;background:var(--ink)}
.vB .plc{margin-top:8px;font:400 13px/1.7 var(--kr);color:var(--muted)}

/* ---------- C. 잔광: 어둠 속 수평선에서 이름이 떠오르고 사진이 밝아온다 ---------- */
.vC{--bg:#101118;--ink:#f3eee7;--muted:#a49e98;--accent:#f0a982;--line:#34343e;--card:#1b1c25;--kr:"Noto Serif KR",serif;--latin:"Cormorant Garamond",serif;--hd:2.9s}
.vC .hero{background:#07080d}
.vC .photo{position:absolute;inset:0;background:radial-gradient(130% 62% at 50% 46%,#f7cfa6 0%,#e39479 16%,#9a5872 36%,#3b2f55 62%,#16152b 100%);
  clip-path:circle(150% at 50% 46%);animation:cReveal 1.25s cubic-bezier(.55,0,.15,1) 1.3s both}
@keyframes cReveal{from{clip-path:circle(0% at 50% 46%)}}
.vC .ph{position:absolute;top:calc(12svh + env(safe-area-inset-top));left:0;right:0;text-align:center;font:400 12px/1 -apple-system,sans-serif;letter-spacing:.08em;color:rgba(255,255,255,.5)}
.vC .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,8,13,.8) 0%,rgba(7,8,13,.4) 34%,rgba(7,8,13,0) 58%)}
.vC .glow{position:absolute;left:-30%;width:160%;top:16svh;height:60svh;background:radial-gradient(closest-side,rgba(255,172,124,.6),rgba(255,112,124,.2) 50%,rgba(255,112,124,0));
  opacity:0;animation:cGlow 2.6s ease .1s both}
@keyframes cGlow{0%{opacity:0;transform:translateY(12svh) scale(.7)}45%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
.vC .line{position:absolute;left:10%;width:80%;top:46svh;height:1px;background:linear-gradient(90deg,rgba(255,130,130,0),#ff9e80 28%,#ffe3b8 50%,#ff9e80 72%,rgba(255,130,130,0));
  box-shadow:0 0 10px rgba(255,165,115,.8);opacity:0;animation:cLine 2.5s cubic-bezier(.6,0,.2,1) .1s both}
@keyframes cLine{0%{opacity:1;transform:scaleX(0)}28%{transform:scaleX(1)}55%{opacity:1}72%{opacity:0;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}
.vC .eb{position:absolute;left:0;right:0;top:calc(62svh - 36px);text-align:center;font:italic 400 21px/1 var(--latin);color:var(--accent)}
.vC .cn{position:absolute;left:0;right:0;top:62svh;overflow:hidden;padding:.12em 0;text-align:center;font:500 25px/1.4 var(--kr);letter-spacing:.14em;color:#fbf5ee;
  animation:cMove 2.5s cubic-bezier(.65,0,.25,1) both}
.vC .cn span{display:inline-block;padding-left:.14em;animation:cRise .9s cubic-bezier(.2,.75,.2,1) .5s both}
.vC .cn em{font:italic 400 24px/1 var(--latin);letter-spacing:0;color:var(--accent);margin:0 .4em 0 .26em}
@keyframes cMove{0%,56%{transform:translateY(calc(-16svh - 48px))}}
@keyframes cRise{from{transform:translateY(110%)}}
.vC .cd{position:absolute;left:0;right:0;top:calc(62svh + 54px);text-align:center;font:400 14px/1 var(--kr);letter-spacing:.1em;color:rgba(251,245,238,.9)}
.vC .cp{position:absolute;left:0;right:0;top:calc(62svh + 80px);text-align:center;font:400 12.5px/1 var(--kr);letter-spacing:.04em;color:rgba(251,245,238,.62)}
.vC .hint{color:rgba(255,255,255,.6)}

/* ---------- 시안 전환 바 (프로토타입 전용) ---------- */
.proto-bar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;
  background:rgba(18,18,20,.92);box-shadow:0 6px 24px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.1);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  font:500 13px/1 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#fff;white-space:nowrap}
.proto-bar button{appearance:none;border:0;background:transparent;color:inherit;font:inherit;height:34px;min-width:34px;padding:0 10px;border-radius:999px;cursor:pointer}
.proto-bar button:active{background:rgba(255,255,255,.14)}
.proto-bar .lbl{padding:0 4px;min-width:104px;text-align:center}
.proto-bar .sep{width:1px;height:18px;background:rgba(255,255,255,.2);margin:0 3px}
.proto-bar [aria-pressed="true"]{background:#fff;color:#111}
</style>
</head>
<body>
<main id="app" class="phone"></main>
<nav class="proto-bar" id="bar" aria-label="시안 전환">
  <button data-act="prev" aria-label="이전 시안">‹</button>
  <span class="lbl" id="lbl"></span>
  <button data-act="next" aria-label="다음 시안">›</button>
  <span class="sep"></span>
  <button data-act="replay">↻ 다시</button>
  <button data-act="revisit" id="revisit" aria-pressed="false">재방문</button>
</nav>
<script>
const DATA = {
  a: "김성준",
  b: "권주영",
  dateDot: "2027. 3. 13.",
  dateLong: "2027년 3월 13일 토요일",
  time: "오후 1시", // 시간 미정 — 확정되면 여기와 timeEn 만 고친다
  timeEn: "1 PM",
  place: "서울 마포구 양화로 130, 5층",
};

const rings = `<svg viewBox="0 0 60 36" aria-hidden="true"><circle cx="23" cy="18" r="13"/><circle cx="37" cy="18" r="13"/></svg>`;
const hint = `<svg class="hint" viewBox="0 0 20 12" aria-hidden="true"><path d="M2 2l8 8 8-8"/></svg>`;

function heroA() {
  return `
<section class="hero">
  <div class="paper"></div>
  <div class="frame">
    <p class="eyebrow rv" style="--i:0">The Wedding Day</p>
    <div class="rings rv" style="--i:1">${rings}</div>
    <p class="nm rv" style="--i:2">${DATA.a}</p>
    <p class="and rv" style="--i:3">&amp;</p>
    <p class="nm rv" style="--i:4">${DATA.b}</p>
    <span class="rule rv" style="--i:5"></span>
    <p class="when rv" style="--i:6">${DATA.dateLong}<br>${DATA.time}</p>
    <p class="where rv" style="--i:7">${DATA.place}</p>
  </div>
  <div class="doors" aria-hidden="true">
    <div class="door l"><span></span></div>
    <div class="door r"><span></span></div>
    <div class="seal">${rings}</div>
  </div>
  ${hint}
</section>`;
}

// 숫자 한 자리 = 0~9 두 바퀴 세로 띠. 아래에서 굴러 올라와 목표 숫자에 멈춘다(오도미터).
function digits(str, line) {
  return [...str].map((ch, j) => {
    const delay = (0.1 + line * 0.16 + j * 0.07).toFixed(2);
    const strip = "01234567890123456789".split("").map((d) => `<i>${d}</i>`).join("");
    return `<span class="dg"><span class="col" style="--t:${10 + Number(ch)};animation-delay:${delay}s">${strip}</span></span>`;
  }).join("");
}

function calendar() {
  const first = new Date(2027, 2, 1).getDay();
  const days = new Date(2027, 3, 0).getDate();
  const loop = `<svg viewBox="0 0 48 40" aria-hidden="true"><path pathLength="1" d="M37 10C30 3 12 3 7 14C2 26 14 36 28 34C41 32 46 20 38 11C34 7 28 5 23 6"/></svg>`;
  let cells = ["일", "월", "화", "수", "목", "금", "토"].map((d, i) => `<span class="wk${i === 0 ? " sun" : ""}">${d}</span>`).join("");
  for (let i = 0; i < first; i++) cells += "<span></span>";
  for (let d = 1; d <= days; d++) {
    const sunday = (first + d - 1) % 7 === 0;
    cells += `<span class="d${d === 13 ? " on" : ""}${sunday ? " sun" : ""}" style="--k:${d}">${d}${d === 13 ? loop : ""}</span>`;
  }
  return cells;
}

function heroB() {
  return `
<section class="hero">
  <div class="top fu" style="--d:.05s"><span>Save the date</span><span>Wedding</span></div>
  <div class="stack" aria-label="2027년 3월 13일">
    <span class="ln">${digits("2027", 0)}</span>
    <span class="ln">${digits("03", 1)}</span>
    <span class="ln">${digits("13", 2)}<em class="dow fu" style="--d:1.15s">SAT<br>${DATA.timeEn}</em></span>
  </div>
  <div class="cal">
    <div class="calh fu" style="--d:.65s"><b>March</b><span>3월</span></div>
    <div class="grid">${calendar()}</div>
  </div>
  <div class="who fu" style="--d:1.7s">
    <p class="nms"><span>${DATA.a}</span><i></i><span>${DATA.b}</span></p>
    <p class="plc">${DATA.dateLong} ${DATA.time}<br>${DATA.place}</p>
  </div>
  ${hint}
</section>`;
}

function heroC() {
  return `
<section class="hero">
  <div class="photo"><span class="ph">여기에 두 분 사진 (세로)</span></div>
  <div class="shade"></div>
  <div class="glow"></div>
  <div class="line"></div>
  <p class="eb fu" style="--d:2.1s">Save the date</p>
  <div class="cn"><span>${DATA.a}<em>&amp;</em>${DATA.b}</span></div>
  <p class="cd fu" style="--d:2.2s">${DATA.dateDot} SAT · ${DATA.time}</p>
  <p class="cp fu" style="--d:2.3s">${DATA.place}</p>
  ${hint}
</section>`;
}

function body() {
  return `
<section class="body">
  <h2>Invitation</h2>
  <p>봄이 시작되는 3월,<br>두 사람이 같은 길을 걷기 시작합니다.<br>귀한 걸음으로 축복해 주시면<br>감사하겠습니다.</p>
  <p class="names">${DATA.a} · ${DATA.b}</p>
  <div class="block">
    <h2>When</h2>
    <p class="big">${DATA.dateLong}<br>${DATA.time}</p>
  </div>
  <div class="block">
    <h2>Where</h2>
    <p class="big">${DATA.place}</p>
    <div class="mapph">지도 자리</div>
    <div class="btns"><a href="#">네이버 지도</a><a href="#">카카오맵</a><a href="#">티맵</a></div>
  </div>
  <p class="note">PROTOTYPE · 첫 화면 시안 비교용 · 인사말은 예시 문구</p>
</section>`;
}

const VARIANTS = {
  A: { name: "편지", len: "2.5초", hero: heroA },
  B: { name: "달력", len: "2.4초", hero: heroB },
  C: { name: "잔광", len: "2.9초", hero: heroC },
};
const KEYS = Object.keys(VARIANTS);

const app = document.getElementById("app");
const bar = document.getElementById("bar");
const lbl = document.getElementById("lbl");
const revisitBtn = document.getElementById("revisit");
const params = new URLSearchParams(location.search);
const state = {
  variant: KEYS.includes(params.get("variant")) ? params.get("variant") : "A",
  revisit: params.get("revisit") === "1",
};
let skipped = false;

function render() {
  const v = VARIANTS[state.variant];
  skipped = state.revisit;
  app.className = `phone v${state.variant}${skipped ? " skip" : ""}`;
  app.innerHTML = v.hero() + body();
  window.scrollTo(0, 0);
  lbl.textContent = `${state.variant} · ${v.name}${state.revisit ? "" : " · " + v.len}`;
  revisitBtn.setAttribute("aria-pressed", String(state.revisit));
  const q = new URLSearchParams({ variant: state.variant });
  if (state.revisit) q.set("revisit", "1");
  history.replaceState(null, "", "?" + q);
  // 재방문은 인트로 없이 짧은 페이드만
  if (state.revisit) app.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 450, easing: "ease-out" });
  // 검수용: ?t=1.2 면 인트로를 1.2초 지점에 멈춘다
  const t = parseFloat(params.get("t"));
  if (!Number.isNaN(t)) document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; });
}

function skip() {
  if (skipped) return;
  skipped = true;
  app.classList.add("skip");
}

function go(step) {
  const i = KEYS.indexOf(state.variant);
  state.variant = KEYS[(i + step + KEYS.length) % KEYS.length];
  render();
}

// 탭·스크롤·키 입력이 오면 인트로를 건너뛴다
app.addEventListener("pointerdown", skip);
addEventListener("wheel", skip, { passive: true });
addEventListener("touchmove", skip, { passive: true });
addEventListener("scroll", () => { if (scrollY > 8) skip(); }, { passive: true });
addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowLeft") return go(-1);
  if (e.key === "ArrowRight") return go(1);
  skip();
});

bar.addEventListener("click", (e) => {
  const act = e.target.closest("button")?.dataset.act;
  if (act === "prev") go(-1);
  if (act === "next") go(1);
  if (act === "replay") { state.revisit = false; render(); }
  if (act === "revisit") { state.revisit = !state.revisit; render(); }
});

// 폰트가 늦게 오면 애니메이션 도중 글꼴이 바뀌어 보이므로, 필요한 글자만 먼저 받아 두고 시작한다(최대 2.5초 대기)
app.className = `phone v${state.variant}`;
const sample = Object.values(DATA).join("") + "그리고초대합니다봄이시작되는월두사람같은길을걷기귀한걸음으로축복해주시면감사하겠습니다지도자리네이버카카오맵티여기에분사진세로일화수목금토TheWeddingDaySaveDateMARCHInvitationWhenWhere0123456789SATPM&";
const fonts = [
  '500 29px "Noto Serif KR"', '400 15px "Noto Serif KR"',
  '400 15px "Noto Sans KR"', '500 19px "Noto Sans KR"',
  'italic 400 22px "Cormorant Garamond"', '500 12px "Cormorant Garamond"',
  '200 100px "Inter Tight"', '300 14px "Inter Tight"', '600 12px "Inter Tight"',
].map((f) => document.fonts.load(f, sample));
Promise.race([Promise.allSettled(fonts), new Promise((r) => setTimeout(r, 2500))]).then(render);
</script>
